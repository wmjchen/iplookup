[project]
name = "iplookup"
version = "0.1.0"
description = "Multi-source IP geolocation and reputation lookup"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.28.0",
  "maxminddb>=2.6.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "ip2location>=8.11.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "respx>=0.21.0",
]

[project.scripts]
iplookup = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: tests that need live network or full local DBs",
]

[tool.uv]
package = true
